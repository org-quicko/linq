# Builds and publishes the linq container image,
# docker/dockerfiles/Dockerfile, to Docker Hub and GHCR.
#
# Triggers on a pushed release tag, vMAJOR.MINOR.PATCH with no suffix, e.g.
# v1.2.3 -> tags the image `1.2.3`, `1.2` and `:latest`. The tagged commit
# must be on main; a release tag anywhere else fails verify before anything
# is pushed. Pre-release tags (alpha) belong to docker-snapshot.yml.
name: docker-release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  BUN_VERSION: "1.4"
  DOCKERHUB_NAMESPACE: labsatquicko
  GHCR_NAMESPACE: org-quicko

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so the tag can be checked against main
      - name: Tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run typecheck
      - name: Test
        run: bun run test

  publish:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Client UI at /, for a server run with LINQ_APP_HOST.
          - dockerfile: docker/dockerfiles/Dockerfile
            image: linq
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # ghcr.io, which is this repository's own registry
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 -> `1.2.3`, `1.2` and `latest`. Built from the git ref alone,
      # so nothing downstream re-derives it.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
            ghcr.io/${{ env.GHCR_NAMESPACE }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
