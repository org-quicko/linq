# Builds and publishes the three linq container images — client, backend,
# full — to GHCR only. Not Docker Hub: these are unreleased builds, and
# Docker Hub is where docker-release.yml's `:latest` lives.
#
# Triggers on:
#   - a push to any branch except main -> tags each image with the branch
#     name
#   - a pushed tag with "alpha" in it, e.g. v0.2.0-alpha.1 -> tags each
#     image with the version (no leading v) and `:alpha`
name: docker-snapshot

on:
  push:
    branches-ignore: [main]
    tags: ["*alpha*"]

permissions:
  contents: read

env:
  BUN_VERSION: "1.4"
  GHCR_NAMESPACE: org-quicko

concurrency:
  group: docker-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run typecheck
      - name: Test
        run: bun run test

  publish:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: dockerfiles/Dockerfile.client
            image: linq-client
          - dockerfile: dockerfiles/Dockerfile.backend
            image: linq-backend
          - dockerfile: dockerfiles/Dockerfile.full
            image: linq
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # ghcr.io, which is this repository's own registry
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The branch name (sanitized) on a branch push, the bare version plus
      # `alpha` on an alpha tag.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.GHCR_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=raw,value=alpha,enable=${{ github.ref_type == 'tag' }}
            type=match,pattern=v(.*),group=1,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
