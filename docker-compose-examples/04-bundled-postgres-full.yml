# Full stack: bundled Postgres, Redis for the redirect cache (docs/adr/0009),
# and Caddy for automatic HTTPS on custom domains (docs/adr/0012).
#
# :2019, Caddy's admin API, is deliberately not published to the host — only
# linq, over the compose network, ever needs to reach it. A custom domain
# still needs its DNS pointed at this host before Caddy's automatic HTTPS can
# issue it a certificate.
#
# Configure POSTGRES_PASSWORD and LINQ_DEFAULT_DOMAIN in .env, then:
#   docker compose -f 04-bundled-postgres-full.yml up
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linq}
      POSTGRES_DB: ${POSTGRES_DB:-linq}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linq} -d ${POSTGRES_DB:-linq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2
    command: caddy run --config /etc/caddy/caddy.json --resume
    volumes:
      - ../caddy/caddy.json:/etc/caddy/caddy.json:ro
      - caddy-data:/data      # issued certificates — must persist
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
      interval: 5s
      timeout: 5s
      retries: 10

  linq:
    env_file:
      # Change this path to use an environment file in another location.
      - ../.env
    build:
      context: ..
      dockerfile: dockerfiles/Dockerfile.full
      args:
        LINQ_CLIENT_BASE_PATH: ${LINQ_CLIENT_BASE_PATH:-/home}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      caddy:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-linq}:${POSTGRES_PASSWORD:-linq}@postgres:5432/${POSTGRES_DB:-linq}
      LINQ_PORT: 3000
      LINQ_DATA_DIR: /data
      LINQ_REDIS_URL: redis://redis:6379
      LINQ_DEFAULT_DOMAIN: ${LINQ_DEFAULT_DOMAIN:-localhost:${LINQ_PORT:-3000}}
      LINQ_CADDY_ADMIN_URL: http://caddy:2019
      LINQ_CADDY_UPSTREAM: linq:3000
      # An admin key is minted and printed on first boot; read it from
      # `docker compose logs linq`. For another without restarting:
      #   docker compose exec linq bun run key:create --name ops --role admin
      # Logs go to stdout and to /data/logs/linq.log. Client IPs are never
      # recorded in either; see docs/adr/0003.
      LINQ_LOG_LEVEL: ${LINQ_LOG_LEVEL:-info}
    volumes:
      - linq-data:/data

volumes:
  postgres-data:
  linq-data:
  caddy-data:
  caddy-config:
