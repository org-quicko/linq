services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: linq
      POSTGRES_PASSWORD: linq
      POSTGRES_DB: linq
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2
    command: caddy run --config /etc/caddy/caddy.json --adapter json
    volumes:
      - ./caddy/caddy.json:/etc/caddy/caddy.json:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      # :2019 (the admin API) is deliberately not published here — only linq,
      # over the compose network, ever needs to reach it.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
      interval: 5s
      timeout: 5s
      retries: 10

  linq:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      caddy:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://linq:linq@postgres:5432/linq
      LINQ_REDIS_URL: redis://redis:6379
      LINQ_DEFAULT_DOMAIN: localhost:3000
      LINQ_CADDY_ADMIN_URL: http://caddy:2019
      LINQ_CADDY_UPSTREAM: linq:3000
      # An admin key is minted and printed on first boot; read it from
      # `docker compose logs linq`. For another without restarting:
      #   docker compose exec linq bun run key:create --name ops --role admin
      # Logs go to stdout and to /data/logs/linq.log. Client IPs are never
      # recorded in either; see docs/adr/0003.
      LINQ_LOG_LEVEL: info
    ports:
      - "3000:3000"
    volumes:
      - linq-data:/data

volumes:
  postgres-data:
  linq-data:
  caddy-data:
  caddy-config:
