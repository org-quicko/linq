# Postgres is never inside the linq image. Copy this file, set a real password
# and a real LINQ_DEFAULT_DOMAIN, then `docker compose up`.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: linq
      POSTGRES_PASSWORD: linq
      POSTGRES_DB: linq
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linq"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Uncomment this service and the two lines marked below to put the redirect
  # cache in Redis instead of inside the linq process. It holds only cached
  # lookups, so it needs no volume: a cold Redis costs one Postgres query per
  # link until it warms back up. See docs/adr/0009 for what the two differ in.
  # redis:
  #   image: redis:8
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10

  linq:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      # redis:                          # with the redis service above
      #   condition: service_healthy
    environment:
      DATABASE_URL: postgres://linq:linq@postgres:5432/linq
      # LINQ_REDIS_URL: redis://redis:6379   # with the redis service above
      LINQ_DEFAULT_DOMAIN: localhost:3000
      # An admin key is minted and printed on first boot; read it from
      # `docker compose logs linq`. For another without restarting:
      #   docker compose exec linq bun run key:create --name ops --role admin
      # Logs go to stdout and to /data/logs/linq.log. Client IPs are never
      # recorded in either; see docs/adr/0003.
      LINQ_LOG_LEVEL: info
    ports:
      - "3000:3000"
    volumes:
      - linq-data:/data

volumes:
  postgres-data:
  linq-data:
