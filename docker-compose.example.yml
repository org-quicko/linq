# Postgres is never inside the linq image. Copy this file, set a real password
# and a real LINQ_DEFAULT_DOMAIN, then `docker compose up`.
#
# The `postgres` service below is a convenience: it runs Postgres in this same
# compose stack. If you already have a Postgres instance (managed, another
# host, whatever), delete or comment out the `postgres` service and its
# `depends_on` entry on `linq`, and point `DATABASE_URL` on `linq` at that
# instance instead.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: linq
      POSTGRES_PASSWORD: linq
      POSTGRES_DB: linq
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linq"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Uncomment this service and the two lines marked below to put the redirect
  # cache in Redis instead of inside the linq process. It holds only cached
  # lookups, so it needs no volume: a cold Redis costs one Postgres query per
  # link until it warms back up. See docs/adr/0009 for what the two differ in.
  # redis:
  #   image: redis:8
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10

  # Uncomment this service and the three lines marked below to give linq's
  # custom domains automatic HTTPS. linq pushes each domain to Caddy's admin
  # API as its own route; nothing here is edited by hand. See
  # docs/adr/0012 and caddy/caddy.json, the empty skeleton Caddy boots from.
  # caddy:
  #   image: caddy:2
  #   command: caddy run --config /etc/caddy/caddy.json --resume
  #   volumes:
  #     - ./caddy/caddy.json:/etc/caddy/caddy.json:ro
  #     - caddy-data:/data      # issued certificates — must persist
  #     - caddy-config:/config
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     # :2019 (the admin API) is deliberately not published here — only linq,
  #     # over the compose network, ever needs to reach it.
  #   healthcheck:
  #     test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10

  linq:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      # redis:                          # with the redis service above
      #   condition: service_healthy
      # caddy:                          # with the caddy service above
      #   condition: service_healthy
    environment:
      # Points at the `postgres` service above. Using your own Postgres
      # instead? Drop the `postgres` service and this service's `depends_on`
      # entry for it, and put that instance's connection string here instead.
      DATABASE_URL: postgres://linq:linq@postgres:5432/linq
      # LINQ_REDIS_URL: redis://redis:6379   # with the redis service above
      LINQ_DEFAULT_DOMAIN: localhost:3000
      # LINQ_CADDY_ADMIN_URL: http://caddy:2019   # with the caddy service above
      # LINQ_CADDY_UPSTREAM: linq:3000            # with the caddy service above
      # An admin key is minted and printed on first boot; read it from
      # `docker compose logs linq`. For another without restarting:
      #   docker compose exec linq bun run key:create --name ops --role admin
      # Logs go to stdout and to /data/logs/linq.log. Client IPs are never
      # recorded in either; see docs/adr/0003.
      LINQ_LOG_LEVEL: info
    ports:
      - "3000:3000"
    volumes:
      - linq-data:/data

volumes:
  postgres-data:
  linq-data:
  caddy-data:
  caddy-config:
